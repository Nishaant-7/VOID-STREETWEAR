<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID Secure Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>window.onRecaptchaApiLoad = function() { window.reCaptchaReady = true; if (window.renderAdminRecaptcha) window.renderAdminRecaptcha(); };</script>
  <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaApiLoad&render=explicit" async defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="window.location.href='index.html'">VOID.</div>
    <div class="nav-controls"><a href="index.html" class="back-link">BACK TO STORE</a></div>
  </nav>
  <main class="view active">
    <div class="form-container">
      <form class="auth-form active-form" onsubmit="handleAdminLogin(event)">
        <h2 class="section-title">SECURE ADMIN LOGIN</h2>
        <p class="password-hint">Administrator access is separate from customer accounts.</p>
        <input type="email" id="admin-login-email" placeholder="ADMIN EMAIL ADDRESS" autocomplete="username" required>
        <input type="password" id="admin-login-password" placeholder="ADMIN PASSWORD" autocomplete="current-password" required>
        <div id="admin-recaptcha-container" class="recaptcha-wrap"></div>
        <button type="submit" class="btn-full">ENTER ADMIN DASHBOARD</button>
        <div class="form-links"><a href="admin-create.html">CREATE ADMIN ACCOUNT</a><a href="index.html">BACK TO STORE</a></div>
      </form>
    </div>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClEdgWwQAsIoSjS06_C80NdejAw-e2kig",
      authDomain: "void-logistics-shaan.firebaseapp.com",
      databaseURL: "https://void-logistics-shaan-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "void-logistics-shaan",
      storageBucket: "void-logistics-shaan.firebasestorage.app",
      messagingSenderId: "956865655329",
      appId: "1:956865655329:web:07ba9ca251068ea9e92960",
      measurementId: "G-8MJWY4DG8M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.firebaseDb = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbGet = get;
</script>
  <script src="firebase-store.js"></script>
  <script src="admin-auth.js"></script>
</body>
</html>
